<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gdGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F9D58" />
      <stop offset="100%" stop-color="#26E07F" />
    </linearGradient>
    <linearGradient id="gdBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#2A65C7" />
    </linearGradient>
    <linearGradient id="gitOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1502F" />
      <stop offset="100%" stop-color="#E44322" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Terminal Rounded Background Badge -->
  <rect width="512" height="512" rx="112" fill="#14171C" />
  
  <!-- Subtle Inner Grid / Tech Frame -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#232833" stroke-width="3" stroke-dasharray="8 8" />

  <g filter="url(#shadow)">
    <!-- Top Sync Chevron (Google Blue) -->
    <path d="M 170 145 L 342 145 C 360 145 372 165 362 181 L 324 245 C 318 255 307 261 295 261 L 205 261 C 190 261 180 245 188 232 L 206 201 L 155 201 C 141 201 133 184 143 174 Z" fill="url(#gdBlue)" />

    <!-- Bottom Left Sync Bar (Google Green) -->
    <path d="M 125 365 L 210 220 C 219 205 241 205 250 220 L 292 292 C 301 307 290 327 273 327 L 180 327 C 168 327 157 334 151 345 L 132 377 C 122 393 99 385 107 367 Z" fill="url(#gdGreen)" />

    <!-- Right Accent Branch with Git Commits (Git Orange) -->
    <!-- Lower Base Line -->
    <path d="M 370 367 L 235 367 C 220 367 210 351 218 338 L 246 290 C 252 280 263 274 275 274 L 330 274 L 312 245 C 304 232 314 216 329 216 L 385 216 C 397 216 405 230 399 240 L 325 367 Z" fill="url(#gitOrange)" />

    <!-- Git Branch Node Overlay (Visualizing gitignore commit tree) -->
    <circle cx="360" cy="274" r="22" fill="#14171C" stroke="#F1502F" stroke-width="8" />
    <circle cx="210" cy="367" r="18" fill="#14171C" stroke="#26E07F" stroke-width="7" />
  </g>
</svg>
