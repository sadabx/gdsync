[package]
name = "gdsync"
version = "0.1.0"
edition = "2021"
description = "High-performance Linux CLI daemon that syncs local directories with Google Drive respecting .gitignore"
license = "GPL-3.0-or-later"
repository = "https://github.com/sadabx/gdsync"

[[bin]]
name = "gdsync"
path = "src/main.rs"

[dependencies]
gdsync-core = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
