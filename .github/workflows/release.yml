name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch_name: x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            arch_name: aarch64
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (for aarch64)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --package gdsync-cli
          else
            cargo build --release --target ${{ matrix.target }} --package gdsync-cli
          fi

      - name: Package release artifact
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/gdsync"
          strip "$BIN_PATH" 2>/dev/null || true
          tar -czf "gdsync-linux-${{ matrix.arch_name }}.tar.gz" -C "target/${{ matrix.target }}/release" gdsync
          sha256sum "gdsync-linux-${{ matrix.arch_name }}.tar.gz" > "gdsync-linux-${{ matrix.arch_name }}.tar.gz.sha256"

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            gdsync-linux-${{ matrix.arch_name }}.tar.gz
            gdsync-linux-${{ matrix.arch_name }}.tar.gz.sha256
